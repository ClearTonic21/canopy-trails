<mat-tree
#tree
[dataSource]="dataSource"
[childrenAccessor]="childrenAccessor"
>
  <mat-tree-node 
    *matTreeNodeDef="let node"
    matTreeNodePadding
  >
    <mat-icon class="mat-icon-rtl-mirror" (click)="selectLeaf(node)" [class.selected]="selectedLeaf === node.index" disabled>eco</mat-icon>
    {{node.name}}
  </mat-tree-node>
  <mat-tree-node
    *matTreeNodeDef="let node;when: hasChild"
    matTreeNodePadding
    matTreeNodeToggle
    [cdkTreeNodeTypeaheadLabel]="node.name"
    (click)="isForest(node)"
  >
    <mat-icon class="mat-icon-rtl-mirror" [class.selected]="tree.isExpanded(node)">
      {{isForest(node) ? 'forest' : 'park'}}
    </mat-icon>
    {{node.name}}
  </mat-tree-node>
</mat-tree>
