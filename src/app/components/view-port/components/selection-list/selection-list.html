<mat-tree
#tree
[dataSource]="dataSource"
[childrenAccessor]="childrenAccessor"
>
  <mat-tree-node 
    *matTreeNodeDef="let node"
    matTreeNodePadding
    (click)="SelectNode(node)"
  >
    <mat-icon [class.selected]="IsSelectedNode(node)">
      eco
    </mat-icon>
    <div
      class="node-name"
      [class.selected-node]="IsSelectedNode(node)"
    >
      {{node.name}}
    </div>
  </mat-tree-node>
  <mat-tree-node
    *matTreeNodeDef="let node; when: hasChild"
    matTreeNodePadding
    matTreeNodeToggle
    [cdkTreeNodeTypeaheadLabel]="node.name"
    (click)="SelectNode(node)"
  >
    <mat-icon [class.selected]="IsSelectedNode(node)">
      {{IsForest(node) ? 'forest' : 'park'}}
    </mat-icon>
    <div
      class="node-name"
      [class.selected-node]="IsSelectedNode(node)"
    >
      {{node.name}}
    </div>
  </mat-tree-node>
</mat-tree>
